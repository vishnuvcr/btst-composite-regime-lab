name: BTST Composite Regime Research

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      max_symbols:
        description: 'Maximum symbols (0 = config default)'
        required: false
        default: '0'
      start_date:
        description: 'Start date YYYY-MM-DD (blank = config)'
        required: false
        default: ''
      end_date:
        description: 'End date YYYY-MM-DD (blank = config)'
        required: false
        default: ''

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download and stage dataset once
        shell: bash
        run: |
          python - <<'PY'
          import glob, os, shutil
          import kagglehub
          p = kagglehub.dataset_download('siddharthhirvaniya/nifty-50-stocks-data-01-jan-2015-to-01-sept-2026')
          files = glob.glob(os.path.join(p, '**', '*.csv'), recursive=True)
          os.makedirs('data/daily', exist_ok=True)
          for f in files:
              shutil.copy2(f, os.path.join('data/daily', os.path.basename(f)))
          print('Dataset:', p)
          print('CSV files staged:', len(files))
          for f in files[:8]:
              print('SAMPLE:', os.path.basename(f))
          PY
      - name: Inspect staged CSV schema
        shell: bash
        run: |
          python - <<'PY'
          import glob, os, pandas as pd
          files = sorted(glob.glob('data/daily/*.csv'))
          stock = [f for f in files if '_10yr_daily' in os.path.basename(f).lower()][:3]
          print('Candidate stock files:', [os.path.basename(f) for f in stock])
          for f in stock:
              print('\nFILE:', f)
              try:
                  z = pd.read_csv(f, nrows=3)
                  print('COLUMNS:', list(z.columns))
                  print(z.head(2).to_string(index=False))
              except Exception as e:
                  print('READ ERROR:', repr(e))
          PY
      - name: Apply workflow date/symbol overrides
        env:
          MAX_SYMBOLS: ${{ inputs.max_symbols }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, yaml
          p=Path('config/composite.yaml')
          c=yaml.safe_load(p.read_text())
          ms=os.getenv('MAX_SYMBOLS','0'); sd=os.getenv('START_DATE',''); ed=os.getenv('END_DATE','')
          if ms and ms != '0': c['data']['max_symbols']=int(ms)
          if sd: c['data']['start_date']=sd
          if ed: c['data']['end_date']=ed
          p.write_text(yaml.safe_dump(c, sort_keys=False))
          print(c['data'])
          PY
      - name: Run regression checks
        run: python -m compileall -q src && pytest -q
      - name: Run strict BTST composite
        run: python src/btst_composite_btst.py --config config/composite.yaml
      - name: Run strict BTST benchmarks and oracle diagnostics
        run: python src/btst_benchmarks.py --config config/composite.yaml
      - name: Publish research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btst-composite-regime-results
          path: docs/
